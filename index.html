<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حضوربان | سامانه هوشمند حضور و غیاب</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#eef2f7;
color:#243247;
}

header{
background:#123b68;
color:white;
padding:22px;
text-align:center;
}

header h1{margin:0;font-size:27px}
header p{margin:8px 0 0;color:#d6e6f8}

.container{
max-width:520px;
margin:25px auto;
padding:15px;
}

.card{
background:white;
padding:22px;
border-radius:16px;
box-shadow:0 4px 18px #00000010;
margin-bottom:18px;
}

h2{
font-size:19px;
color:#123b68;
margin-top:0;
}

label{
display:block;
margin:13px 0 7px;
font-size:14px;
}

input{
width:100%;
padding:13px;
border:1px solid #d5dce5;
border-radius:9px;
font-family:Tahoma;
font-size:14px;
}

button{
width:100%;
border:0;
border-radius:9px;
padding:14px;
font-family:Tahoma;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
background:#1769aa;
color:white;
}

button:active{opacity:.8}

.green{background:#16834c}
.red{background:#c43c3c}
.gray{background:#64748b}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.menu button{
background:#e9f1fa;
color:#123b68;
}

.info{
background:#f0f5fb;
padding:13px;
border-radius:9px;
margin:10px 0;
font-size:14px;
}

.hidden{display:none}

footer{
text-align:center;
color:#7b8796;
font-size:12px;
padding:20px;
}
</style>
</head>

<body>

<header>
<h1>حضوربان</h1>
<p>سامانه هوشمند حضور و غیاب کارکنان</p>
</header>

<div class="container">

<div class="card" id="login">
<h2>ورود کارکنان</h2>

<label>نام</label>
<input id="first" placeholder="نام خود را وارد کنید">

<label>نام خانوادگی</label>
<input id="last" placeholder="نام خانوادگی">

<label>کد ملی</label>
<input id="national" maxlength="10" inputmode="numeric" placeholder="کد ملی">

<label>کد پرسنلی</label>
<input id="personnel" placeholder="کد پرسنلی">

<button onclick="loginUser()">ورود به سامانه</button>
</div>

<div class="hidden" id="dashboard">

<div class="card">
<h2>خوش آمدید</h2>
<div class="info" id="welcome"></div>
<div class="info" id="date"></div>
</div>

<div class="card">
<h2>منوی اصلی</h2>

<div class="menu">
<button onclick="showSection('attendance')">ثبت تردد</button>
<button onclick="showSection('location')">موقعیت مکانی</button>
<button onclick="showSection('profile')">اطلاعات پرسنلی</button>
<button onclick="showSection('settings')">تنظیمات</button>
</div>
</div>

<div class="card" id="attendance">
<h2>ثبت ورود و خروج</h2>

<div class="info" id="status">وضعیت: آماده ثبت تردد</div>

<button class="green" onclick="record('ورود')">ثبت ورود</button>
<button class="red" onclick="record('خروج')">ثبت خروج</button>

<div class="info" id="records">هنوز ترددی ثبت نشده است.</div>
</div>

<div class="card hidden" id="location">
<h2>موقعیت مکانی</h2>
<div class="info" id="gps">موقعیت مکانی هنوز بررسی نشده است.</div>
<button onclick="getLocation()">بررسی موقعیت مکانی</button>
</div>

<div class="card hidden" id="profile">
<h2>اطلاعات پرسنلی</h2>
<div class="info" id="profileInfo"></div>
</div>

<div class="card hidden" id="settings">
<h2>تنظیمات</h2>
<div class="info">زبان سامانه: فارسی</div>
<div class="info">چیدمان: راست‌چین</div>
<button class="gray" onclick="logout()">خروج از حساب کاربری</button>
</div>

<button class="gray" onclick="logout()">خروج از سامانه</button>

</div>

</div>

<footer>
حضوربان | سامانه هوشمند مدیریت تردد کارکنان
</footer>

<script>

let employee={};

function loginUser(){

let first=document.getElementById("first").value.trim();
let last=document.getElementById("last").value.trim();
let national=document.getElementById("national").value.trim();
let personnel=document.getElementById("personnel").value.trim();

if(!first || !last || !national || !personnel){
alert("لطفاً تمام اطلاعات را وارد کنید.");
return;
}

if(!/^\d{10}$/.test(national)){
alert("کد ملی باید ۱۰ رقم باشد.");
return;
}

employee={first,last,national,personnel};

document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("welcome").innerText=
"کاربر: "+first+" "+last;

document.getElementById("profileInfo").innerText=
"نام: "+first+" "+last+
"\nکد ملی: "+national+
"\nکد پرسنلی: "+personnel;

updateDate();

}

function updateDate(){

document.getElementById("date").innerText=
"تاریخ و ساعت: "+
new Date().toLocaleString("fa-IR");

}

function showSection(id){

["attendance","location","profile","settings"].forEach(x=>{
document.getElementById(x).classList.add("hidden");
});

document.getElementById(id).classList.remove("hidden");

}

function record(type){

if(!employee.first){
alert("ابتدا وارد سامانه شوید.");
return;
}

let time=new Date().toLocaleString("fa-IR");

document.getElementById("status").innerText=
"آخرین تردد: "+type+" در "+time;

document.getElementById("records").innerText=
"آخرین عملیات ثبت‌شده: "+type+" - "+time;

}

function getLocation(){

let gps=document.getElementById("gps");

if(!navigator.geolocation){
gps.innerText="امکان بررسی موقعیت مکانی وجود ندارد.";
return;
}

gps.innerText="در حال بررسی موقعیت مکانی...";

navigator.geolocation.getCurrentPosition(

position=>{
gps.innerText=
"موقعیت دریافت شد.\n"+
"عرض جغرافیایی: "+position.coords.latitude+
"\nطول جغرافیایی: "+position.coords.longitude;
},

()=>{
gps.innerText="دریافت موقعیت ناموفق بود. دسترسی GPS را بررسی کنید.";
},

{enableHighAccuracy:true,timeout:15000}
);

}

function logout(){

employee={};

document.getElementById("dashboard").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");

["first","last","national","personnel"].forEach(id=>{
document.getElementById(id).value="";
});

}

</script>

</body>
  </html>
